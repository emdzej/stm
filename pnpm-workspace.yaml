packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@serialport/bindings-cpp': false
  esbuild: false
  node-pty: true
# Security floors for transitive deps (dev/build-time only) until upstreams
# (eslint -> minimatch, workbox-build -> ajv / filelist) pick them up.
overrides:
  'brace-expansion@>=2.0.0 <2.1.4': ^2.1.4
  'brace-expansion@>=3.0.0 <5.0.9': ^5.0.9
  'fast-uri@>=3.0.0 <3.1.6': ^3.1.6

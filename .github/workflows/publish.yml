name: Publish stm-tunnel to npm

# Triggered on GitHub release publication. Uses npm trusted publishing
# (OIDC) — no NPM_TOKEN secret required.
#
# One-time setup on npmjs.com:
#   1. Sign in, go to the @emdzej/stm-tunnel package settings.
#   2. Add a trusted publisher with:
#        Publisher: GitHub Actions
#        Organization / user: <github-org-or-user>
#        Repository: stm
#        Workflow filename: publish.yml
#        Environment: (leave empty unless you use one)
#   3. First publish of a new package must still be done manually with
#      `npm publish --access public --provenance`, since trusted publishing
#      can only attach to an existing package.
#
# OIDC requires npm >= 11.5 for fully tokenless publishing. The npm version
# is pinned (not @latest) so a compromised or broken npm release can't
# ride along into a publish with id-token: write.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Manual runs only from main; releases publish whatever they point at.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Use pinned npm (for OIDC trusted publishing)
        run: npm install -g npm@11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          if [ "$TAG" != "$version" ] && [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match @emdzej/stm-tunnel version $version" >&2
            exit 1
          fi

      - name: Test
        run: pnpm --filter @emdzej/stm-tunnel... test

      - name: Build CLI bundle
        run: pnpm --filter @emdzej/stm-tunnel build

      - name: Publish
        run: pnpm --filter @emdzej/stm-tunnel publish --access public --provenance --no-git-checks
